# Open WebUI + SearXNG
# 使い方: docker compose up -d   (停止: docker compose down)
# 接続先などの値は .env から読み込む（.env.example 参照）

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3
    ports:
      - "127.0.0.1:3000:8080"   # この PC からのみ http://localhost:3000 で開ける
    volumes:
      - open-webui:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: ${VL_BASE_URL:?.env に VL_BASE_URL を設定してください}
      OPENAI_API_KEY: ${VL_API_KEY:-dummy}
      ENABLE_OLLAMA_API: "false"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      WEB_SEARCH_RESULT_COUNT: "5"
    depends_on:
      - searxng
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.10.19-81371861f
    # ホストには公開しない（Open WebUI から内部ネットワーク経由でのみ使う）
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?.env に SEARXNG_SECRET を設定してください}
    restart: unless-stopped

volumes:
  open-webui:
